<dialog id="user-modal" aria-labelledby="modal-title" aria-describedby="modal-description"><div class="modal-inner"><h2 id="modal-title">Add team member</h2><p id="modal-description">Fields marked required must be completed.</p><button class="icon-button" type="button" data-close-modal aria-label="Close dialog">×</button><form id="user-form"><fieldset><legend>Account information</legend><label class="required" for="modal-name">Full name</label><input id="modal-name" name="modal-name" type="text" required minlength="2" autocomplete="name"><label class="required" for="modal-email">Email</label><input id="modal-email" name="modal-email" type="email" required autocomplete="email"></fieldset><button class="btn btn-ghost" type="button" data-close-modal>Cancel</button><button class="btn btn-primary" type="submit">Create account</button></form></div></dialog>
