<fieldset><legend>Accessible controls</legend><label class="required" for="text">Text</label><input id="text" type="text" required minlength="2" maxlength="80" autocomplete="name"><label for="email-control">Email</label><input id="email-control" type="email" autocomplete="email"><label for="tel-control">Telephone</label><input id="tel-control" type="tel" autocomplete="tel"><label for="password-control">Password</label><input id="password-control" type="password" minlength="8" autocomplete="new-password"><label for="number-control">Number</label><input id="number-control" type="number" min="1" max="100"><label for="date-control">Date</label><input id="date-control" type="date"><label for="select-control">Select</label><select id="select-control"><option>Option one</option><option>Option two</option></select><label for="textarea-control">Message</label><textarea id="textarea-control" maxlength="500"></textarea></fieldset><fieldset><legend>Choices</legend><label><input type="checkbox"> Receive updates</label><label><input type="radio" name="choice" value="weekly"> Weekly</label><label><input type="radio" name="choice" value="monthly"> Monthly</label></fieldset>
